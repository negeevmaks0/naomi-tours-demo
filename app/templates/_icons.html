{% macro icon(name, cls="ico") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "calendar" %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "plane" %}<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
{%- elif name == "bus" %}<path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2s-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
{%- elif name == "pin" %}<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>
{%- elif name == "check" %}<path d="M20 6 9 17l-5-5"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
{%- elif name == "send" %}<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>
{%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "back" %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "euro" %}<path d="M4 10h12M4 14h9M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/>
{%- elif name == "compass" %}<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6z"/>
{%- elif name == "route" %}<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>
{%- elif name == "users" %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>
{%- elif name == "wave" %}<path d="M2 6c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2M2 12c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2M2 18c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2"/>
{%- elif name == "list" %}<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>
{%- elif name == "shield" %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == "help" %}<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>
{%- elif name == "chat" %}<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro transport_icon(transport, cls="ico") -%}
{{ icon("plane" if "Авиа" in transport else "bus", cls) }}
{%- endmacro %}

{% macro tour_visual(tour, cls) -%}
{% if tour.image %}
<img class="{{ cls }}" src="{{ static_url(tour.image) }}" alt="{{ tour.title }}" loading="lazy">
{% else %}
<div class="{{ cls }} placeholder" style="--h: {{ destination_hue(tour.destination) }}" role="img" aria-label="{{ tour.destination }}">
  <span class="ph-name">{{ tour.destination }}</span>
</div>
{% endif %}
{%- endmacro %}
